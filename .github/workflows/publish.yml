name: Publish Extension

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Package VSIX
        run: npx vsce package

      - name: Publish to Open VSX
        run: npx ovsx publish *.vsix -p ${{ secrets.OPEN_VSX }}